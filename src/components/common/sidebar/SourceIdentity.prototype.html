<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ChatLab · 会话来源辨识原型</title>
    <!-- Throwaway UI prototype: one proposed sidebar and conversation-header treatment.
     Question: can users distinguish and filter QQ / WeCom without renaming chats?
     All records below are illustrative. No production data, requests or persistence.
     Run: python3 -m http.server 4318 --bind 127.0.0.1 (repository root). -->
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f6f8;
        --surface: #fff;
        --soft: #f8f9fb;
        --hover: #f3f4f7;
        --line: #e7e9ef;
        --ink: #242835;
        --sub: #626b7b;
        --muted: #788294;
        --accent: #ce4266;
        --accent-bg: #fdf0f3;
        --accent-hover: #b73557;
        --qq: #245dc3;
        --qq-bg: #edf3ff;
        --wecom: #17754f;
        --wecom-bg: #eaf6ef;
        --avatar: #eff1f5;
        --shadow: 0 12px 40px #17243b12;
        --focus: #b73557;
        --font: 'Geist', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        --mono: 'SFMono-Regular', Consolas, monospace;
        --radius: 8px;
        --text-xs: 11px;
        --text-sm: 12px;
        --text-base: 14px;
        --text-lg: 20px;
      }
      :root.dark {
        color-scheme: dark;
        --bg: #15161c;
        --surface: #1c1e25;
        --soft: #20232b;
        --hover: #272b35;
        --line: #303541;
        --ink: #f1f2f6;
        --sub: #bbc1cf;
        --muted: #a0a9bc;
        --accent: #f07b9a;
        --accent-bg: #3a2631;
        --accent-hover: #ffa0b9;
        --qq: #98b9ff;
        --qq-bg: #24334e;
        --wecom: #83d8ae;
        --wecom-bg: #20392d;
        --avatar: #2a2e38;
        --focus: #f07b9a;
        --shadow: 0 12px 40px #0003;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: var(--text-base)/1.5 var(--font);
        font-optical-sizing: auto;
      }
      button,
      input {
        font: inherit;
      }
      button {
        cursor: pointer;
        border: 0;
        background: none;
        color: inherit;
      }
      button:hover {
        background: var(--hover);
      }
      button:active {
        transform: translateY(1px);
      }
      button:disabled {
        cursor: default;
        opacity: 0.65;
      }
      button:disabled:active {
        transform: none;
      }
      :focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 3px;
      }
      svg {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
        vertical-align: middle;
      }
      .icon {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .prototype-bar {
        height: 47px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 26px;
        border-bottom: 1px solid var(--line);
        font-size: var(--text-sm);
        color: var(--sub);
      }
      .prototype-bar strong {
        font-weight: 600;
        color: var(--ink);
      }
      .prototype-bar .right {
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .theme {
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 3px 10px;
        font-size: 12px;
        background: var(--surface);
      }
      .app {
        height: calc(100vh - 91px);
        min-height: 650px;
        max-width: 1560px;
        margin: auto;
        display: grid;
        grid-template-columns: 328px minmax(0, 1fr);
        background: var(--surface);
      }
      .sidebar {
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--line);
        min-height: 0;
      }
      .brand {
        height: 74px;
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 10px 22px 0;
      }
      .brand img {
        width: 27px;
        height: 27px;
      }
      .brand-name {
        font-size: 25px;
        font-weight: 750;
        letter-spacing: -0.8px;
        color: var(--accent);
      }
      .version {
        font-size: 11px;
        color: var(--muted);
        margin-left: 2px;
      }
      .brand .layout-icon {
        margin-left: auto;
        color: var(--sub);
      }
      .global-nav {
        padding: 9px 14px 17px;
        display: grid;
        gap: 3px;
        border-bottom: 1px solid var(--line);
      }
      .nav-line {
        display: flex;
        align-items: center;
        gap: 13px;
        height: 35px;
        padding: 0 12px;
        color: var(--sub);
        font-weight: 500;
      }
      .nav-line svg {
        width: 19px;
      }
      .nav-line:first-child {
        color: var(--ink);
      }
      .filters {
        padding: 17px 17px 8px;
      }
      .type-tabs {
        display: flex;
        gap: 24px;
        height: 33px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 14px;
      }
      .type-tabs button {
        font-size: 13px;
        color: var(--sub);
        padding: 0 2px 10px;
        position: relative;
      }
      .type-tabs button.active {
        color: var(--accent);
        font-weight: 600;
      }
      .type-tabs button.active:after {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        bottom: -1px;
        height: 2px;
        background: var(--accent);
      }
      .type-tabs .actions {
        display: flex;
        gap: 10px;
        margin-left: auto;
        color: var(--muted);
      }
      .type-tabs .actions svg {
        width: 16px;
      }
      .sources {
        display: grid;
        grid-template-columns: 1.14fr 0.85fr 1fr;
        gap: 5px;
        margin-bottom: 12px;
      }
      .source-chip {
        display: flex;
        gap: 6px;
        justify-content: center;
        align-items: center;
        height: 31px;
        border: 1px solid var(--line);
        border-radius: 6px;
        font-size: 12px;
        color: var(--sub);
        white-space: nowrap;
      }
      .source-chip .num {
        font-size: 11px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .source-chip.active {
        border-color: var(--ink);
        color: var(--ink);
        background: var(--soft);
        font-weight: 600;
      }
      .source-chip[data-source='qq'].active {
        border-color: var(--qq);
        background: var(--qq-bg);
        color: var(--qq);
      }
      .source-chip[data-source='wecom'].active {
        border-color: var(--wecom);
        background: var(--wecom-bg);
        color: var(--wecom);
      }
      .source-chip svg {
        width: 13px;
        height: 13px;
      }
      .search {
        border: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 8px;
        border-radius: 7px;
        padding: 7px 10px;
        color: var(--muted);
        background: var(--soft);
      }
      .search:focus-within {
        border-color: var(--accent);
      }
      .search svg {
        width: 16px;
        height: 16px;
      }
      .search input {
        min-width: 0;
        width: 100%;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--ink);
        font-size: 12px;
      }
      .search input::placeholder {
        color: var(--muted);
      }
      .list-label {
        display: flex;
        justify-content: space-between;
        padding: 5px 22px 8px;
        font-size: 11px;
        color: var(--muted);
      }
      .session-list {
        overflow: auto;
        padding: 0 9px 10px;
        flex: 1;
        scrollbar-width: thin;
      }
      .session-row {
        width: 100%;
        display: flex;
        align-items: center;
        text-align: left;
        gap: 11px;
        padding: 10px 12px;
        border-radius: 8px;
        position: relative;
        margin-bottom: 2px;
      }
      .session-row[aria-current='true'] {
        background: var(--accent-bg);
      }
      .session-row[aria-current='true']:before {
        content: '';
        position: absolute;
        left: 0;
        width: 3px;
        height: 26px;
        border-radius: 2px;
        background: var(--accent);
      }
      .avatar {
        height: 37px;
        width: 37px;
        flex-shrink: 0;
        display: grid;
        place-items: center;
        border-radius: 10px;
        background: var(--avatar);
        color: var(--sub);
        font-size: 17px;
        font-weight: 500;
      }
      .session-row[aria-current='true'] .avatar {
        background: var(--surface);
        color: var(--accent);
      }
      .session-body {
        min-width: 0;
        flex: 1;
      }
      .session-title {
        font-size: 13px;
        font-weight: 550;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: var(--ink);
        margin-bottom: 5px;
        line-height: 1.2;
      }
      .session-row[aria-current='true'] .session-title {
        color: var(--accent);
      }
      .session-meta {
        display: flex;
        align-items: center;
        gap: 7px;
        color: var(--muted);
        font-size: 11px;
        white-space: nowrap;
      }
      .platform-badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 10px;
        font-weight: 600;
        line-height: 18px;
        padding: 0 5px;
        border-radius: 4px;
      }
      .platform-badge svg {
        width: 11px;
        height: 11px;
      }
      .platform-badge.qq {
        background: var(--qq-bg);
        color: var(--qq);
      }
      .platform-badge.wecom {
        background: var(--wecom-bg);
        color: var(--wecom);
      }
      .sidebar-footer {
        height: 51px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px;
        border-top: 1px solid var(--line);
        font-size: 11px;
        color: var(--sub);
      }
      .sidebar-footer button {
        border-radius: 5px;
        padding: 5px 3px;
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .sidebar-footer svg {
        width: 14px;
        height: 14px;
      }
      .sidebar-footer .small-note {
        color: var(--muted);
      }
      main {
        min-width: 0;
        display: flex;
        flex-direction: column;
        position: relative;
        overflow: hidden;
      }
      .chat-header {
        padding: 27px 34px 0;
        flex-shrink: 0;
      }
      .chat-heading {
        display: flex;
        align-items: flex-start;
        gap: 13px;
      }
      .chat-avatar {
        height: 44px;
        width: 44px;
        border-radius: 12px;
        background: var(--accent-bg);
        color: var(--accent);
        display: grid;
        place-items: center;
        font-weight: 600;
        font-size: 20px;
      }
      h1 {
        font-size: 22px;
        line-height: 1.3;
        margin: 0 0 7px;
        font-weight: 650;
        letter-spacing: -0.4px;
      }
      .heading-info {
        display: flex;
        align-items: center;
        gap: 9px;
        color: var(--sub);
        font-size: 11px;
        flex-wrap: wrap;
      }
      .heading-info .platform-badge {
        font-size: 11px;
        line-height: 21px;
        padding: 0 7px;
      }
      .separator {
        color: var(--line);
      }
      .source-link {
        margin-left: auto;
        font-size: 12px;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 7px 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        white-space: nowrap;
      }
      .source-link svg {
        width: 14px;
        height: 14px;
      }
      .chat-tabs {
        display: flex;
        gap: 25px;
        margin-top: 28px;
        height: 39px;
        border-bottom: 1px solid var(--line);
        color: var(--sub);
        font-size: 13px;
      }
      .chat-tab {
        display: flex;
        align-items: flex-start;
        gap: 7px;
        height: 39px;
        padding: 0 1px 12px;
      }
      .chat-tab svg {
        width: 16px;
        height: 16px;
        margin-top: 2px;
      }
      .chat-tab.active {
        color: var(--accent);
        border-bottom: 2px solid var(--accent);
        font-weight: 600;
      }
      .records-toolbar {
        display: flex;
        align-items: center;
        gap: 14px;
        margin: 20px 34px 15px;
      }
      .records-toolbar .search {
        max-width: 360px;
        width: 100%;
        background: var(--surface);
        padding: 9px 11px;
      }
      .scope-note {
        font-size: 11px;
        color: var(--muted);
        margin-left: auto;
        white-space: nowrap;
      }
      .record-head {
        display: grid;
        grid-template-columns: 70px 165px minmax(0, 1fr);
        gap: 14px;
        padding: 11px 20px;
        margin: 0 34px;
        background: var(--soft);
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        font-size: 11px;
        color: var(--sub);
      }
      .records {
        padding: 0 34px 24px;
        overflow: auto;
        flex: 1;
      }
      .date-line {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 22px 4px 12px;
        font-size: 11px;
        color: var(--sub);
      }
      .date-line:after {
        content: '';
        height: 1px;
        background: var(--line);
        flex: 1;
      }
      .date-line strong {
        font-size: 12px;
        font-weight: 600;
      }
      .record {
        display: grid;
        grid-template-columns: 70px 165px minmax(0, 1fr);
        gap: 14px;
        align-items: start;
        padding: 17px 20px;
        border-bottom: 1px solid var(--line);
        font-size: 12px;
      }
      .record time {
        font: 11px/1.8 var(--mono);
        color: var(--muted);
      }
      .sender {
        display: flex;
        gap: 8px;
        align-items: center;
        color: var(--sub);
        font-size: 12px;
      }
      .mini-avatar {
        width: 25px;
        height: 25px;
        background: var(--avatar);
        border-radius: 7px;
        display: grid;
        place-items: center;
        font-size: 11px;
        color: var(--sub);
        flex-shrink: 0;
      }
      .message {
        line-height: 1.85;
        color: var(--ink);
      }
      .message p {
        margin: 0;
      }
      .message .quote {
        padding: 7px 11px;
        border-left: 2px solid var(--line);
        background: var(--soft);
        margin-top: 9px;
        color: var(--sub);
        font-size: 11px;
      }
      .attachment {
        display: flex;
        align-items: center;
        gap: 10px;
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 10px 13px;
        max-width: 265px;
        margin-top: 9px;
      }
      .attachment svg {
        color: var(--accent);
        width: 21px;
        height: 21px;
      }
      .attachment small {
        display: block;
        color: var(--muted);
        font-size: 10px;
      }
      .empty {
        padding: 35px 15px;
        text-align: center;
        font-size: 12px;
        color: var(--sub);
      }
      .empty button {
        color: var(--accent);
        margin-top: 12px;
        padding: 6px 10px;
        border-radius: 5px;
        border: 1px solid var(--line);
      }
      .chat-footer {
        height: 38px;
        border-top: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 34px;
        color: var(--muted);
        font-size: 10px;
      }
      .design-note {
        height: 44px;
        border-top: 1px solid var(--line);
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 35px;
        font-size: 11px;
        color: var(--sub);
      }
      .design-note b {
        font: 10px var(--mono);
        color: var(--accent);
        margin-right: 8px;
      }
      .source-panel {
        position: absolute;
        right: 20px;
        top: 78px;
        width: 320px;
        max-width: calc(100% - 24px);
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface);
        box-shadow: var(--shadow);
        z-index: 10;
        padding: 20px;
      }
      .source-panel[hidden] {
        display: none;
      }
      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 17px;
        font-size: 14px;
        font-weight: 600;
      }
      .panel-header button {
        padding: 3px;
        border-radius: 5px;
      }
      .source-panel dl {
        margin: 0;
        font-size: 12px;
        display: grid;
        grid-template-columns: 90px 1fr;
        gap: 12px 4px;
      }
      .source-panel dt {
        color: var(--sub);
      }
      .source-panel dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      .panel-footer {
        margin-top: 18px;
        padding-top: 13px;
        border-top: 1px solid var(--line);
        font-size: 11px;
        color: var(--sub);
        line-height: 1.8;
      }
      .panel-source {
        margin-top: 10px;
        width: 100%;
        text-align: left;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .panel-source small {
        color: var(--muted);
        font-size: 11px;
      }
      .prototype-state {
        color: var(--sub);
      }
      .mobile-back {
        display: none;
      }
      .prototype-state code {
        font: 11px var(--mono);
      }
      @media (min-width: 1500px) {
        .app {
          border-left: 1px solid var(--line);
          border-right: 1px solid var(--line);
        }
      }
      @media (max-width: 1050px) {
        .app {
          grid-template-columns: 302px minmax(0, 1fr);
        }
        .chat-header {
          padding: 27px 24px 0;
        }
        .records-toolbar {
          margin: 20px 24px 15px;
        }
        .records {
          padding: 0 24px 24px;
        }
        .record-head {
          margin: 0 24px;
        }
        .record-head,
        .record {
          grid-template-columns: 58px 105px minmax(0, 1fr);
          gap: 10px;
          padding-left: 12px;
          padding-right: 12px;
        }
        .scope-note {
          display: none;
        }
        .source-link {
          font-size: 11px;
        }
        .heading-info {
          gap: 5px;
        }
        .prototype-state {
          display: none;
        }
      }
      @media (max-width: 760px) {
        .app {
          grid-template-columns: 100%;
          min-height: 650px;
        }
        .sidebar {
          border-right: 0;
        }
        .app main {
          display: none;
        }
        .app.detail .sidebar {
          display: none;
        }
        .app.detail main {
          display: flex;
        }
        .mobile-back {
          display: block;
          padding: 3px;
          margin: 0 0 12px;
          color: var(--sub);
          font-size: 12px;
        }
        .chat-heading {
          flex-wrap: wrap;
        }
        .source-link {
          margin-left: 0;
        }
        .chat-header {
          padding-top: 20px;
        }
        .prototype-bar {
          padding: 0 16px;
        }
        .prototype-bar .right {
          gap: 10px;
        }
        .design-note {
          gap: 15px;
          font-size: 10px;
        }
        .record-head,
        .record {
          grid-template-columns: 52px 76px minmax(0, 1fr);
          gap: 8px;
          padding: 12px 0;
        }
        .sender {
          font-size: 11px;
        }
        .mini-avatar {
          display: none;
        }
        .session-row {
          padding-top: 12px;
          padding-bottom: 12px;
        }
        .source-panel {
          right: 12px;
          top: 120px;
        }
        .records-toolbar .search {
          max-width: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          scroll-behavior: auto !important;
          transition: none !important;
        }
      }
      @media (prefers-contrast: more) {
        :root {
          --line: #8b91a0;
          --muted: #565e6d;
        }
        :root.dark {
          --line: #818a9f;
          --muted: #c2c8d6;
        }
      }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <symbol id="search" viewBox="0 0 24 24">
          <circle cx="10.5" cy="10.5" r="7.2" />
          <path d="m16 16 5 5" />
        </symbol>
        <symbol id="plus" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16" /></symbol>
        <symbol id="chat" viewBox="0 0 24 24">
          <path d="M5 4h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-8l-5 4v-4H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z" />
          <path d="M7 10h.1M12 10h.1M17 10h.1" />
        </symbol>
        <symbol id="chart" viewBox="0 0 24 24">
          <path d="M3 4h18M5 4v14h14V4M12 18v4M7 22h10M8 14l3-4 3 2 3-5" />
        </symbol>
        <symbol id="users" viewBox="0 0 24 24">
          <circle cx="9" cy="7" r="3" />
          <path d="M3 21v-3a6 6 0 0 1 12 0v3M16 4a3 3 0 0 1 0 6M18 14c2 1 3 2 3 5v2" />
        </symbol>
        <symbol id="panel" viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="2" />

    <script>

      }
      const sessions = [
        { id: 'cpa', name: 'CPA(CLI Proxy API)交流群', p: 'qq', n: 144904, t: 'group' },

        `<span class="platform-badge ${p}">${svg(platforms[p].icon)}${full ? platforms[p].name : platforms[p].short}</span>`

        sessions.filter(
          (s) =>
            (state.type === 'all' || s.t === state.type) &&
            s.name.toLowerCase().includes(state.query.toLowerCase().trim())
        )
      function renderList() {
        const base = baseRows()
        $('sources').innerHTML = ['all', 'qq', 'wecom']
          .map(
            (p) =>
              `<button class="source-chip ${state.source === p ? 'active' : ''}" data-source="${p}" aria-pressed="${state.source === p}">${p === 'all' ? '全部来源' : svg(platforms[p].icon) + platforms[p].short}<span class="num">${p === 'all' ? base.length : base.filter((s) => s.p === p).length}</span></button>`
          )
          .join('')
        const rows = base.filter((s) => state.source === 'all' || s.p === state.source)
        $('list-summary').textContent =
          `${state.source === 'all' ? '全部来源' : platforms[state.source].name} · ${rows.length} 个会话`
        $('session-list').innerHTML = rows.length
          ? rows
              .map(
                (s) =>

              )

              ['10:51:12', '小周', '这个方案可以试一下。把来源和上下文留住，后面回看会方便很多。'],
              ['11:02:35', '阿远', '整理了一份讨论提纲，先放在这里。', 'file'],
              ['11:06:49', '木白', '群名相同的时候，也要能看出来是哪个平台的群。', 'quote'],
              ['11:08:21', '小周', '是的，工作群和兴趣群最好可以单独筛选。'],
            ]
          : [
              ['13:16:28', '产品同学', '今天的联调清单已整理，先确认各项验收口径。'],
              ['13:19:04', '研发同学', '接口部分已准备好，下午可以一起核对。'],
              ['13:23:37', '测试同学', '收到，回归结果会统一更新到清单里。'],
              ['13:28:16', '产品同学', '请保留问题对应的会话和来源，方便后续跟进。'],
              ['13:32:45', '研发同学', '这里是更新后的验收清单。', 'file'],
              ['13:38:02', '测试同学', '确认后我会继续做下一轮回归。', 'quote'],
            ]
      }
      function renderMessages() {
        const s = sessions.find((s) => s.id === state.selected)
        const data = sampleMessages(s).filter((m) => m.slice(1, 3).join(' ').includes(state.messageQuery.trim()))
        $('records').innerHTML = data.length
          ? `<div class="date-line"><strong>2026 年 11 月 12 日</strong><span>星期四</span></div>` +
            data
              .map(
                (m) =>
                  `<article class="record"><time>${m[0]}</time><div class="sender"><span class="mini-avatar">${m[1].slice(-1)}</span>${m[1]}</div><div class="message"><p>${m[2]}</p>${m[3] === 'file' ? `<div class="attachment">${svg('file')}<span>讨论与验收清单.md<small>Markdown · 示例附件</small></span></div>` : ''}${m[3] === 'quote' ? '<div class="quote">引用示例：保留来源，才能准确理解上下文。</div>' : ''}</div></article>`
              )
              .join('')
          : '<div class="empty">没有匹配的示例消息</div>'
      }
      function renderDetail() {
        const s = sessions.find((s) => s.id === state.selected),
          p = platforms[s.p]
        $('chat-title').textContent = s.name
        $('chat-avatar').textContent = s.name.slice(0, 1)
        $('heading-info').innerHTML =
          `${badge(s.p, true)}<span>${p.account}</span><span class="separator">/</span><span>${s.t === 'group' ? '群聊' : '私聊'}</span><span class="separator">/</span><span>${fmt(s.n)} 条消息</span>`
        $('scope-note').textContent = `仅搜索「${s.name}」`
        $('chat-footer-source').textContent = `来源：${p.name} · ${p.account}　/　上次导入 ${p.last}`
        renderMessages()
        renderPanel()
      }
      function renderPanel(all = false) {
        const s = sessions.find((s) => s.id === state.selected),
          p = platforms[s.p]
        $('source-panel').hidden = !state.panel
        $('source-details').setAttribute('aria-expanded', state.panel)
        $('source-panel').innerHTML =
          `<div class="panel-header"><span>${all ? '消息来源' : '会话来源'}</span><button id="close-panel" aria-label="关闭来源详情">${svg('close')}</button></div>` +
          (all
            ? Object.entries(platforms)
                .map(
                  ([k, v]) =>
                    `<button class="panel-source" data-panel-filter="${k}"><span>${badge(k, true)}<br><small>${v.account} · ${sessions.filter((s) => s.p === k).length} 个会话</small></span><small>查看会话 →</small></button>`
                )
                .join('')
            : `<dl><dt>平台</dt><dd>${badge(s.p, true)}</dd><dt>账号备注</dt><dd>${p.account}</dd><dt>数据源</dt><dd>${p.source}</dd><dt>导入方式</dt><dd>自动同步 · 本机采集</dd><dt>同步间隔</dt><dd>${p.cadence}</dd><dt>上次导入</dt><dd>今天 ${p.last}</dd><dt>下次拉取</dt><dd>今天 ${p.next}</dd></dl>`) +
          `<div class="panel-footer">${all ? '平台、账号与会话分别识别。同名群保留独立来源，不会按名称合并。' : '来源标识固定展示，不随会话重命名改变。暂停同步后，历史记录仍保留原平台。'}<br>本面板的账号备注、时间均为原型示例。</div>`
      }
      function render() {
        renderList()
        renderDetail()
      }
      $('sources').addEventListener('click', (e) => {
        const b = e.target.closest('[data-source]')
        if (!b) return
        state.source = b.dataset.source
        const selected = sessions.find((s) => s.id === state.selected)
        if (state.source !== 'all' && selected.p !== state.source) {
          const first = baseRows().find((s) => s.p === state.source)
          if (first) {
            state.selected = first.id
            state.messageQuery = ''
            $('message-search').value = ''
          }
        }
        state.panel = false
        render()
      })
      $('type-tabs').addEventListener('click', (e) => {
        const b = e.target.closest('[data-type]')
        if (!b) return
        state.type = b.dataset.type
        renderList()
      })
      $('session-search').addEventListener('input', (e) => {
        state.query = e.target.value
        renderList()
      })
      $('session-list').addEventListener('click', (e) => {
        const b = e.target.closest('[data-id]')
        if (b) {
          state.selected = b.dataset.id
          state.messageQuery = ''
          $('message-search').value = ''
          state.panel = false
          render()
          $('app').classList.add('detail')
        }
        if (e.target.closest('#clear-filters')) {
          state.source = 'all'
          state.type = 'all'
          state.query = ''
          $('session-search').value = ''
          renderList()
        }
      })
      $('message-search').addEventListener('input', (e) => {
        state.messageQuery = e.target.value
        renderMessages()
      })
      $('source-details').addEventListener('click', () => {
        state.panel = !state.panel
        renderPanel()
        if (state.panel) $('close-panel').focus()
      })
      $('all-sources').addEventListener('click', () => {
        state.panel = true
        $('app').classList.add('detail')
        renderPanel(true)
        $('close-panel').focus()
      })
      $('source-panel').addEventListener('click', (e) => {
        if (e.target.closest('#close-panel')) {
          state.panel = false
          renderPanel()
          $('source-details').focus()
        }
        const b = e.target.closest('[data-panel-filter]')
        if (b) {
          state.source = b.dataset.panelFilter
          state.panel = false
          renderPanel()
          renderList()
          $('app').classList.remove('detail')
        }
      })
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && state.panel) {
          state.panel = false
          renderPanel()
          $('source-details').focus()
        }
      })
      document.addEventListener('click', (e) => {
        if (state.panel && !e.target.closest('#source-panel,#source-details,#all-sources')) {
          state.panel = false
          renderPanel()
        }
      })
      $('back').onclick = () => {
        $('app').classList.remove('detail')
        state.panel = false
        renderPanel()
      }
      $('theme').onclick = () => {
        document.documentElement.classList.toggle('dark')
        $('theme').textContent = document.documentElement.classList.contains('dark') ? '切换浅色' : '切换深色'
      }
      render()
    </script>
  </body>
</html>
