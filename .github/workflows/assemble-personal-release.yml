name: Assemble verified ChatLab Personal release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing source version tag
        required: true
        type: string
      build_run:
        description: Run with both successful personal desktop builds
        required: true
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: personal-release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  assemble:
    if: github.repository == 'bufferducky/ChatLab'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate completed build and source identity
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          BUILD_RUN: ${{ inputs.build_run }}
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const version=JSON.parse(fs.readFileSync('package.json')).version;
          if(process.env.RELEASE_TAG!==`v${version}` || !/^\d+$/.test(process.env.BUILD_RUN)) throw Error('Invalid release identity');
          const read=path=>JSON.parse(execFileSync('gh',['api',`repos/${process.env.GITHUB_REPOSITORY}/${path}`],{encoding:'utf8'}));
          const run=read(`actions/runs/${process.env.BUILD_RUN}`);
          if(run.path!=='.github/workflows/personal-release.yml') throw Error('Unexpected build workflow');
          const jobs=read(`actions/runs/${process.env.BUILD_RUN}/jobs?per_page=100`).jobs;
          const expected=['identity','build (macos-15, mac, arm64)','build (windows-latest, win, x64)'];
          for(const name of expected) if(!jobs.some(j=>j.name===name&&j.conclusion==='success')) throw Error(`Missing successful ${name}`);
          const log=execFileSync('gh',['run','view',process.env.BUILD_RUN,'--log','--job',String(jobs.find(j=>j.name==='identity').id)],{encoding:'utf8'});
          const commit=execFileSync('git',['rev-list','-n','1',process.env.RELEASE_TAG],{encoding:'utf8'}).trim();
          if(!log.includes(commit)) throw Error('Build checkout does not match release tag');
          fs.appendFileSync(process.env.GITHUB_ENV,`RELEASE_SOURCE_COMMIT=${commit}\n`);
          JS
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run }}
          pattern: personal-*
          merge-multiple: true
          path: release-dist
      - name: Verify notes, updater hashes and exact asset list
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          BUILD_RUN: ${{ inputs.build_run }}
        run: |
          node scripts/personal-release.mjs notes release-notes.md
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          fs.writeFileSync('release-dist/BUILD_INFO.json',JSON.stringify({
            version:JSON.parse(fs.readFileSync('package.json')).version,
            commit:process.env.RELEASE_SOURCE_COMMIT,
            sourceTag:process.env.RELEASE_TAG,
            repository:process.env.GITHUB_REPOSITORY,
            buildRun:process.env.BUILD_RUN,
            assemblyRun:process.env.GITHUB_RUN_ID,
            platforms:['macOS arm64','Windows x64'],signed:false,
          },null,2)+'\n');
          JS
          node scripts/personal-release.mjs verify release-dist --write-checksums
      - name: Create complete draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release create "$RELEASE_TAG" release-dist/* --verify-tag --draft --title "ChatLab Personal $RELEASE_TAG" --notes-file release-notes.md
      - name: Redownload and independently verify uploaded assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release download "$RELEASE_TAG" --dir verified-release
          node scripts/personal-release.mjs verify verified-release
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi
